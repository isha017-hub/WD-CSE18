/* NAVBAR */

.navbar{
background:#131921;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
flex-wrap:wrap;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:45px;
font-weight:bold;
color:#ff9900;
cursor:pointer;
}

.search{
display:flex;
flex:1;
max-width:700px;
}

.search input{
width:100%;
padding:14px;
border:none;
outline:none;
font-size:16px;
border-radius:5px 0 0 5px;
}

.search button{
padding:14px 22px;
border:none;
background:#febd69;
cursor:pointer;
font-size:18px;
border-radius:0 5px 5px 0;
}

.nav-right{
display:flex;
gap:25px;
align-items:center;
color:white;
}

.nav-item{
cursor:pointer;
font-size:17px;
transition:.3s;
}

.nav-item:hover{
color:#ff9900;
}

/* MENU */

padding:15px 20px;
overflow:auto;
}

color:white;
cursor:pointer;
white-space:nowrap;
font-size:18px;
transition:.3s;
}

color:orange;

align-items:center;

color:white;

}

color:white;
border-radius:40px;
cursor:pointer;
}

.hero button:hover{
background:#e68a00;
}

/* PRODUCTS */

.products{
display:grid;

repeat(auto-fit,minmax(260px,1fr));
gap:25px;
padding:30px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
transition:.3s;
position:relative;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.badge{
position:absolute;
top:15px;
left:15px;
background:red;
color:white;
padding:5px 12px;
border-radius:20px;
font-size:13px;
}

.card-content{
padding:18px;
}

.card h3{
font-size:23px;
margin-bottom:10px;
}

.rating{
color:#ff9900;
margin-bottom:10px;
}

.price{

font-weight:bold;
margin-bottom:10px;
}

.desc{
font-size:14px;

margin-bottom:15px;
}

.card button{
padding:13px;
width:100%;
border:none;
background:#ffd814;

font-size:16px;
border-radius:8px;
transition:.3s;
}

.card button:hover{
background:orange;

}

/* FOOTER */

padding:50px;
text-align:center;

/* DISPLAY PRODUCTS */

function displayProducts(items){

let productHTML = "";

items.forEach(product=>{

productHTML += `

<div class="card">

<div class="badge">
HOT
</div>

<img src="${product.image}">

<div class="card-content">

<h3>${product.name}</h3>

<div class="rating">
${product.rating}
</div>

<p class="price">
${product.price}
</p>

<p class="desc">
${product.desc}
</p>

<button onclick="addCart()">
Add To Cart
</button>

</div>

</div>

`;

});

document.getElementById("products")
.innerHTML = productHTML;

}

/* FILTER */

function filterProducts(category){

if(category==="all"){

displayProducts(products);

}
else{

let filtered =
products.filter(product =>
product.category===category
);

displayProducts(filtered);

}

}

/* SEARCH */

function searchProduct(){

let input =
document.getElementById("search")
.value
.toLowerCase();

let filtered =
products.filter(product =>
product.name.toLowerCase().includes(input)
);

displayProducts(filtered);

}

/* CART */

let cart = 0;

function addCart(){

cart++;

document.getElementById("cart")
.innerHTML = cart;

alert("✅ Product Added To Cart");

}

/* ORDER */

function placeOrder(){

if(cart > 0){

alert("🎉 Order Placed Successfully!");

}
else{

alert("🛒 Your Cart Is Empty!");

}

}

/* DEFAULT */

displayProducts(products);

</script>
